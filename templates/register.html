<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calibre Web - 注册</title>    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">    <style>
        :root {
            --page-bg: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --card-bg: #ffffff;
            --text-primary: #333333;
            --text-secondary: #666666;
            --input-bg: #ffffff;
            --input-border: #e0e0e0;
            --input-focus-border: #667eea;
            --input-focus-shadow: rgba(102, 126, 234, 0.1);
            --accent: #667eea;
            --btn-bg: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --alert-error-bg: #fef2f2;
            --alert-error-color: #c33;
            --alert-error-border: #fecaca;
            --alert-success-bg: #f0fdf4;
            --alert-success-color: #3c3;
            --alert-success-border: #a7f3d0;
        }

        body[data-theme="dark"] {
            --page-bg: linear-gradient(135deg, #2a2a3e 0%, #181825 100%);
            --card-bg: #252535;
            --text-primary: #cdd6f4;
            --text-secondary: #a6adc8;
            --input-bg: #2a2a3e;
            --input-border: #3a3a50;
            --input-focus-border: #89b4fa;
            --input-focus-shadow: rgba(137, 180, 250, 0.12);
            --accent: #89b4fa;
            --btn-bg: linear-gradient(135deg, #454576 0%, #3a3a66 100%);
            --alert-error-bg: #3a1e2e;
            --alert-error-color: #f38ba8;
            --alert-error-border: #5a2d40;
            --alert-success-bg: #1e3a2f;
            --alert-success-color: #a6e3a1;
            --alert-success-border: #2d5a45;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--page-bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .register-container {
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
            padding: 40px;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            color: var(--accent);
            font-size: 32px;
            margin-bottom: 10px;
        }

        .logo p {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-primary);
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid var(--input-border);
            border-radius: 10px;
            font-size: 14px;
            background: var(--input-bg);
            color: var(--text-primary);
            transition: all 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--input-focus-border);
            box-shadow: 0 0 0 3px var(--input-focus-shadow);
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: var(--btn-bg);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .links {
            text-align: center;
            margin-top: 20px;
        }

        .links a {
            color: var(--accent);
            text-decoration: none;
            font-size: 14px;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .alert {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .alert-error {
            background-color: var(--alert-error-bg);
            color: var(--alert-error-color);
            border: 1px solid var(--alert-error-border);
        }

        .alert-success {
            background-color: var(--alert-success-bg);
            color: var(--alert-success-color);
            border: 1px solid var(--alert-success-border);
        }
    </style>
</head>
<body>
    <script>
        (function() {
            const saved = localStorage.getItem('theme') || 'light';
            document.body.setAttribute('data-theme', saved === 'dark' ? 'dark' : 'light');
        })();
    </script>
    <div class="register-container">
        <div class="logo">
            <h1>📚 Calibre Web</h1>
            <p>创建您的账号</p>
        </div>

        <div id="alert" class="alert"></div>

        <form id="registerForm">
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username" required>
            </div>

            <div class="form-group">
                <label for="email">邮箱</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" required minlength="6">
            </div>

            <div class="form-group">
                <label for="confirmPassword">确认密码</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required>
            </div>

            <button type="submit" class="btn">注册</button>
        </form>

        <div class="links">
            <a href="/login">已有账号？立即登录</a>
        </div>
    </div>

    <script>
        const form = document.getElementById('registerForm');
        const alertDiv = document.getElementById('alert');

        function showAlert(message, type) {
            alertDiv.textContent = message;
            alertDiv.className = `alert alert-${type}`;
            alertDiv.style.display = 'block';
            setTimeout(() => {
                alertDiv.style.display = 'none';
            }, 5000);
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                showAlert('两次输入的密码不一致', 'error');
                return;
            }

            if (password.length < 6) {
                showAlert('密码长度至少为6位', 'error');
                return;
            }

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    showAlert('注册成功！正在跳转到登录页面...', 'success');
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 1500);
                } else {
                    showAlert(data.error || '注册失败', 'error');
                }
            } catch (error) {
                showAlert('网络错误，请稍后重试', 'error');
            }
        });
    </script>
</body>
</html>
